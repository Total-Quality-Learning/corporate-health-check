name: Laporan bug
description: Hasil hitung salah, skrip error, atau perilaku tak sesuai
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill / skrip
      placeholder: mis. baca-laporan-keuangan
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah reproduksi
      description: Perintah yang dijalankan dan data input (gunakan data fiktif).
    validations:
      required: true
  - type: textarea
    id: hasil
    attributes:
      label: Hasil sekarang vs yang diharapkan
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Versi Python & OS
