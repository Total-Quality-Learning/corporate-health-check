name: Tes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Container resmi Python dipakai karena runner Ubuntu terbaru tidak lagi menyediakan Python 3.9.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Pasang dependensi
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-optional.txt

      - name: Jalankan tes
        run: python -m unittest discover tests -v
